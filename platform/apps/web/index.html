<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback for browsers that ignore SVG favicons, and the iOS home screen. -->
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#030305" />

    <title>desc — bounty escrow on Solana, judged by AI</title>
    <meta
      name="description"
      content="Bounty escrow that can actually decide. USDC locked on Solana, released by a panel of AI moderators judging the delivered work against criteria both sides agreed up front."
    />

    <!-- Link previews. Absolute urls on purpose: a scraper has no page context
         to resolve a relative path against. %SITE_URL% is filled at build time
         from DESC_DOMAIN (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="desc" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="desc — bounty escrow on Solana, judged by AI" />
    <meta
      property="og:description"
      content="USDC locked on Solana, released by a panel of AI moderators judging the delivered work against criteria both sides agreed up front."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="desc — bounty escrow that can actually decide" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="desc — bounty escrow on Solana, judged by AI" />
    <meta
      name="twitter:description"
      content="USDC locked on Solana, released by a panel of AI moderators judging the delivered work against criteria both sides agreed up front."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
