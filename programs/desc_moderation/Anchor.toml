[toolchain]
# Pin the CLI to the `anchor-lang` the programs build against. Without it
# every build warns that the two differ, which buries real warnings.
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
desc_moderation = "AHGBmnYQCXJwnKKPixjmt6KAbDjVpMQtETRASzycJ47T"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
